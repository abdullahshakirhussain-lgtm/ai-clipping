<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 240px; font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 14px; color: #111; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .row { display: flex; align-items: center; gap: 8px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
      p { margin: 8px 0 0; color: #555; }
      code { background: #f1f1f1; padding: 1px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>ClipFactory Poster</h1>
    <div class="row"><span class="dot"></span><span>Active</span></div>
    <p>Open your ClipFactory <b>Distribution</b> page and click <b>Post to YouTube</b> on a queued clip.</p>
    <p id="last"></p>
    <script src="popup.js"></script>
  </body>
</html>
