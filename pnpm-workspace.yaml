packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/darwin-arm64": true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  ffmpeg-static: true
  ffprobe-static: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  youtube-dl-exec: true
  onnxruntime-node: true

# Packages allowed to run install/build scripts. Must include every platform
# variant of native deps: the build host's platform decides which one resolves
# (Railway/Docker = linux-x64; local dev here = windows-x64).
onlyBuiltDependencies:
  - "@embedded-postgres/windows-x64"
  - "@embedded-postgres/linux-x64"
  - "@embedded-postgres/linux-arm64"
  - "@embedded-postgres/darwin-x64"
  - "@embedded-postgres/darwin-arm64"
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - ffmpeg-static
  - ffprobe-static
  - msgpackr-extract
  - prisma
  - sharp
  - youtube-dl-exec
  - onnxruntime-node
